<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信桥 · 管理台</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0e1013; --panel:#14171c; --panel-2:#181c22; --line:#23272e; --line-2:#2e333c;
    --fg:#e8eaed; --dim:#8b93a1; --dim-2:#6b7280;
    --acc:#6ea8fe; --acc-dim:#1e2a3d; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13.5px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:var(--acc); text-decoration:none; }
  code, .mono { font-family:var(--mono); font-size:12.5px; }

  /* ── top bar ─────────────────────────────────────────────────────────── */
  header { position:sticky; top:0; z-index:20; background:rgba(14,16,19,.94); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 18px; height:52px; }
  .brand { font-weight:600; letter-spacing:.02em; }
  .brand span { color:var(--dim-2); font-weight:400; margin-left:6px; }
  .spacer { flex:1; }
  .modes { display:flex; border:1px solid var(--line-2); border-radius:7px; overflow:hidden; }
  .modes button { background:transparent; color:var(--dim); border:0; padding:5px 13px; font:inherit; cursor:pointer; }
  .modes button + button { border-left:1px solid var(--line-2); }
  .modes button.on { background:var(--acc-dim); color:#dce9ff; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--dim-2); flex:none; }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 3px rgba(63,185,80,.14); }
  .dot.warn { background:var(--warn); box-shadow:0 0 0 3px rgba(210,153,34,.14); }
  .dot.bad { background:var(--err); box-shadow:0 0 0 3px rgba(248,81,73,.16); }

  /* ── shell ───────────────────────────────────────────────────────────── */
  .shell { display:grid; grid-template-columns:186px 1fr; min-height:calc(100vh - 52px); }
  nav { border-right:1px solid var(--line); padding:14px 10px; position:sticky; top:52px; align-self:start; height:calc(100vh - 52px); overflow:auto; }
  nav .group { color:var(--dim-2); font-size:11px; letter-spacing:.09em; text-transform:uppercase; padding:12px 8px 6px; }
  nav button { display:block; width:100%; text-align:left; background:transparent; color:var(--dim); border:0;
               border-left:2px solid transparent; padding:7px 9px; font:inherit; cursor:pointer; border-radius:0 6px 6px 0; }
  nav button:hover { color:var(--fg); background:var(--panel); }
  nav button.on { color:#dce9ff; background:var(--acc-dim); border-left-color:var(--acc); }
  main { padding:20px 22px 96px; max-width:1000px; }
  section { display:none; } section.on { display:block; }
  h2 { font-size:15px; margin:0 0 4px; font-weight:600; }
  .lead { color:var(--dim); margin:0 0 16px; max-width:70ch; }

  /* ── blocks ──────────────────────────────────────────────────────────── */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:15px 16px; margin-bottom:12px; }
  .card > .head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .card > .head strong { font-size:13.5px; }
  .card > .head .hint { color:var(--dim); font-size:12px; }
  .rule { height:1px; background:var(--line); margin:14px -16px; }

  .field { display:grid; grid-template-columns:170px 1fr; gap:6px 14px; padding:9px 0; align-items:start; }
  .field + .field { border-top:1px solid var(--line); }
  .field > .label { color:var(--dim); padding-top:6px; }
  .field > .label b { display:block; color:var(--fg); font-weight:500; }
  .field > .label small { display:block; color:var(--dim-2); font-size:11.5px; line-height:1.5; margin-top:2px; }
  .field .control { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hint { color:var(--dim); font-size:12px; margin-top:5px; max-width:62ch; }
  .hint.warn { color:var(--warn); }
  input[type=text], input[type=number], textarea, select {
    background:#0b0d10; color:var(--fg); border:1px solid var(--line-2); border-radius:6px;
    padding:6px 9px; font:inherit; min-width:0; }
  input[type=text], input[type=number], select { width:100%; max-width:420px; }
  input.mono, textarea.mono { font-family:var(--mono); font-size:12.5px; }
  textarea { width:100%; resize:vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:1px solid var(--acc); outline-offset:1px; border-color:var(--acc); }
  input:disabled, select:disabled { opacity:.55; }
  label.check { display:inline-flex; align-items:center; gap:7px; color:var(--fg); }

  button.act { background:var(--acc); color:#08111f; border:0; border-radius:6px; padding:7px 14px; font:inherit; font-weight:500; cursor:pointer; }
  button.act:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:var(--panel-2); color:var(--fg); border:1px solid var(--line-2); border-radius:6px; padding:6px 11px; font:inherit; cursor:pointer; }
  button.ghost:hover { border-color:var(--acc); color:#dce9ff; }
  button.mini { background:transparent; color:var(--dim); border:1px solid var(--line-2); border-radius:5px; padding:3px 8px; font:inherit; font-size:12px; cursor:pointer; }
  button.mini:hover { color:var(--fg); border-color:var(--acc); }
  button.danger { color:var(--err); border-color:#43272a; }
  button.danger:hover { color:#ffb4ae; border-color:var(--err); }

  .tag { display:inline-block; padding:1px 7px; border-radius:4px; border:1px solid var(--line-2); font-size:11.5px; color:var(--dim); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .dim { color:var(--dim); } .dim2 { color:var(--dim-2); }

  pre { white-space:pre-wrap; word-break:break-word; background:#0b0d10; border:1px solid var(--line);
        border-radius:7px; padding:11px 12px; max-height:460px; overflow:auto; font-family:var(--mono); font-size:12.5px; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim-2); font-weight:500; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; }
  tbody tr { cursor:default; }
  tbody tr.sel td { background:var(--acc-dim); }
  tbody tr.pick { cursor:pointer; }
  tbody tr.pick:hover td { background:var(--panel-2); }

  .statusline { display:flex; align-items:center; gap:11px; font-size:15px; font-weight:500; }
  .checks { display:grid; gap:0; margin-top:12px; }
  .check { display:grid; grid-template-columns:14px 132px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); align-items:start; }
  .check .what { color:var(--dim); }
  .check .why { color:var(--fg); font-size:12.5px; }
  .check .fix { color:var(--warn); font-size:12px; margin-top:3px; }

  .choices { display:grid; gap:9px; }
  .choice { border:1px solid var(--line-2); border-radius:8px; padding:11px 13px; cursor:pointer; background:var(--panel-2); }
  .choice:hover { border-color:#3c4657; }
  .choice.on { border-color:var(--acc); background:var(--acc-dim); }
  .choice b { display:block; font-weight:600; margin-bottom:3px; }
  .choice span { color:var(--dim); font-size:12.5px; }

  .savebar { position:fixed; left:186px; right:0; bottom:0; z-index:30; display:none; align-items:center; gap:12px;
             padding:11px 22px; background:rgba(20,23,28,.97); border-top:1px solid var(--line-2); backdrop-filter:blur(8px); }
  .savebar.on { display:flex; }
  #toast { position:fixed; right:18px; bottom:70px; background:var(--panel-2); border:1px solid var(--line-2);
           padding:10px 14px; border-radius:8px; display:none; max-width:58ch; z-index:40; box-shadow:0 8px 26px rgba(0,0,0,.45); }
  .banner { border:1px solid #43272a; background:#1d1416; color:#ffb4ae; border-radius:8px; padding:10px 13px; margin-bottom:12px; font-size:12.5px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:10px; }
  .stat { background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:11px 13px; }
  .stat .k { color:var(--dim-2); font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; }
  .stat .v { font-size:19px; font-family:var(--mono); margin-top:3px; }
  .kbd { font-family:var(--mono); font-size:12px; background:#0b0d10; border:1px solid var(--line-2); border-radius:4px; padding:1px 5px; }
</style>
</head>
<body>

<header>
  <div class="brand">微信桥<span>管理台</span></div>
  <div class="modes" id="modes">
    <button data-mode="simple">新手模式</button>
    <button data-mode="advanced">高级模式</button>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="healthPill"><span class="dot" id="healthDot"></span><span id="healthText">体检中…</span></span>
  <span class="pill" id="patchPill" title="配置文件"></span>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div class="savebar" id="savebar">
  <span id="saveCount" class="dim">有未保存的修改</span>
  <button class="act" id="saveBtn">保存</button>
  <button class="ghost" id="revertBtn">放弃修改</button>
  <span id="saveMsg" class="dim"></span>
</div>

<div id="toast"></div>

<script>
// ── plumbing ────────────────────────────────────────────────────────────────
const TOKEN = new URLSearchParams(location.search).get('token') || '__ADMIN_TOKEN__';
const H = { 'content-type': 'application/json', 'x-admin-token': TOKEN, 'x-wechat-admin': '1' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const toast = (html) => { const t = $('#toast'); t.innerHTML = html; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 6500); };

async function api(path, opts) {
  const r = await fetch(path, { headers: H, ...opts });
  const j = await r.json().catch(() => ({ ok: false, error: 'bad json' }));
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const S = { data: null, health: null, problems: null, memory: null, models: null, backups: null, dirty: {}, section: 'overview' };
const isAdvanced = () => S.mode === 'advanced';

// ── sections ────────────────────────────────────────────────────────────────
// nav is generated from this table so the two modes can never drift apart.
const SECTIONS = [
  { id:'overview',    label:'概览',        both:true,  render: renderOverview },
  { id:'connect',     label:'谁能跟我说话', adv:'连接与凭据', render: renderConnect },
  { id:'model',       label:'用哪个大脑',   adv:'模型',      render: renderModel },
  { id:'memory',      label:'它记不记得住', adv:'长期记忆',   render: renderMemory },
  { id:'context',     label:'聊久了怎么办', adv:'上下文方案', render: renderContext },
  { id:'chat',        label:'对话',        only:true, render: renderChat },
  { id:'fields',      label:'全部配置项',   only:true, render: renderFields },
  { id:'diag',        label:'出问题了',     adv:'诊断与备份', render: renderDiag },
];

function renderNav() {
  const groups = isAdvanced()
    ? [{ title:'配置', ids:['overview','connect','model','memory','context'] },
       { title:'运维', ids:['chat','fields','diag'] }]
    : [{ title:'配置', ids:['overview','connect','model','memory','context'] },
       { title:'帮助', ids:['diag'] }];
  $('#nav').innerHTML = groups.map((g) => `<div class="group">${esc(g.title)}</div>` + g.ids.map((id) => {
    const s = SECTIONS.find((x) => x.id === id);
    if (!s || (s.only && !isAdvanced())) return '';
    const label = isAdvanced() && s.adv ? s.adv : s.label;
    return `<button data-go="${id}" class="${S.section === id ? 'on' : ''}">${esc(label)}</button>`;
  }).join('')).join('');
  $('#nav').querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
}

function go(id) {
  S.section = id;
  renderNav();
  const s = SECTIONS.find((x) => x.id === id);
  $('#main').innerHTML = '';
  if (s) s.render($('#main'));
  window.scrollTo({ top: 0 });
}

// ── config fields (the single source of truth is the server's CONFIG_FIELDS) ─
const F = (key) => (S.data?.fields ?? []).find((f) => f.key === key) || { key, label:key };
const rawValue = (key) => (S.data?.plainValues ?? {})[key] ?? '';
const shownValue = (key) => (F(key).secret ? (S.data?.values ?? {})[key] ?? '' : rawValue(key));

/** A control bound to one config key; changes are collected, not written. */
function field(key, opts = {}) {
  const f = F(key);
  const secret = !!f.secret;
  const value = shownValue(key);
  const changed = S.dirty[key] !== undefined;
  const current = changed ? (S.dirty[key] ?? '') : value;
  const label = opts.label ?? f.label;
  const sub = opts.sub ?? f.hint ?? '';
  let control;
  if (opts.type === 'select') {
    const options = opts.options ?? [];
    const known = options.some((o) => o.value === current);
    control = `<select data-key="${esc(key)}" class="mono">
      ${options.map((o) => `<option value="${esc(o.value)}"${o.value === current ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
      ${known || !current ? '' : `<option value="${esc(current)}" selected>${esc(current)}（当前）</option>`}
      <option value="__custom__"${opts.custom ? ' selected' : ''}>自定义…</option>
    </select>`;
  } else if (opts.type === 'textarea' || f.kind === 'list') {
    control = `<textarea rows="${opts.rows ?? 2}" data-key="${esc(key)}" data-secret="${secret}" class="mono"
      placeholder="${esc(f.placeholder || '每行一个')}">${esc(current)}</textarea>`;
  } else if (opts.type === 'checkbox') {
    control = `<label class="check"><input type="checkbox" data-key="${esc(key)}" ${current === 'on' ? 'checked' : ''}> ${esc(opts.checkLabel ?? '开启')}</label>`;
  } else {
    control = `<input type="text" data-key="${esc(key)}" data-secret="${secret}" class="mono"
      placeholder="${esc(f.placeholder || f.default || '')}" value="${esc(current)}">`;
  }
  const reveal = secret ? `<button class="mini" data-reveal="${esc(key)}">显示</button>` : '';
  const flag = changed ? ' <span class="tag warn">已改</span>' : '';
  return `<div class="field">
    <div class="label"><b>${esc(label)}${flag}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <div><div class="control">${control}${reveal}</div>${opts.after ?? ''}</div>
  </div>`;
}

/** Bind the controls just rendered: collect edits into S.dirty. */
function bindFields(root = document) {
  root.querySelectorAll('[data-key]').forEach((el) => {
    // Idempotent: sections re-render and re-bind, and a second bind would reset
    // the baseline (dataset.original) to the edited value, which silently makes
    // a real change look like "no change" to the save bar.
    if (el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    const key = el.dataset.key;
    el.dataset.original = el.value;
    el.dataset.originalChecked = el.checked ? '1' : '0';
    const mark = (dirty) => {
      const b = el.closest('.field')?.querySelector('.label b');
      if (!b) return;
      const tag = b.querySelector('.tag');
      if (dirty && !tag) b.insertAdjacentHTML('beforeend', ' <span class="tag warn">已改</span>');
      // The tag has to come off again when the value returns to the original,
      // or the field keeps claiming a change the counter no longer counts.
      if (!dirty && tag) tag.remove();
    };
    const collect = () => {
      let v;
      if (el.type === 'checkbox') v = el.checked ? 'on' : '';
      else v = el.value.trim();
      // The "custom…" sentinel is a UI affordance, never a value.
      if (v === '__custom__') { delete S.dirty[key]; mark(false); updateSaveBar(); return; }
      const original = el.type === 'checkbox'
        ? (el.dataset.originalChecked === '1' ? 'on' : '')
        : (el.dataset.original ?? '').trim();
      if (v === original) delete S.dirty[key];
      else S.dirty[key] = v;
      mark(S.dirty[key] !== undefined);
      updateSaveBar();
    };
    el.addEventListener('change', collect);
    el.addEventListener('input', collect);
    root.querySelectorAll(`[data-reveal="${key}"]`).forEach((btn) => btn.addEventListener('click', async () => {
      try {
        const j = await api('/api/reveal?key=' + encodeURIComponent(key));
        el.value = j.value; el.dataset.secret = 'false'; el.dataset.original = j.value;
        delete S.dirty[key]; mark(false); updateSaveBar(); btn.remove();
      } catch (e) { toast('<span class="err">' + esc(e.message) + '</span>'); }
    }));
  });
}

/** Which fields exist only in advanced mode — used to explain hidden changes. */
const ADVANCED_ONLY = ['cwd','mediaDir','agentProvider','imageInput','imageInputModel','memoryFile','problemFile','contextPolicy','imageInput','ocrApiKey','ocrModel','ocrBaseUrl','imageGenApiKey','imageGenModel','imageGenDir','sttApiKey','sttModel','ttsApiKey','ttsModel','ttsVoice','smtpHost','smtpPort','smtpUsername','smtpPassword','smtpFromName','esp32BaseUrl','digestIntervalSec','approvalTimeoutSec','maxMessageChars','sendChunkDelayMs','reminderFile','morningFile'];

function updateSaveBar() {
  const keys = Object.keys(S.dirty);
  const hidden = isAdvanced() ? [] : keys.filter((k) => ADVANCED_ONLY.includes(k));
  $('#savebar').classList.toggle('on', keys.length > 0);
  const labels = keys.slice(0, 4).map((k) => F(k).label || k).join('、');
  $('#saveCount').innerHTML = keys.length === 1
    ? `将修改：<span class="mono">${esc(labels)}</span>`
    : `将修改 ${keys.length} 项：<span class="mono">${esc(labels)}${keys.length > 4 ? ' …' : ''}</span>`
      + (hidden.length ? ` <span class="warn">（其中 ${hidden.length} 项是高级设置，新手模式看不到）</span>` : '');
}

async function save() {
  const updates = {};
  for (const [key, value] of Object.entries(S.dirty)) {
    const f = F(key);
    if (f.kind === 'number' && value !== '' && !/^-?\d+$/.test(value)) {
      $('#saveMsg').innerHTML = `<span class="err">${esc(f.label)} 只能填整数，收到「${esc(value)}」</span>`;
      toast(`<span class="err">${esc(f.label)} 只能填整数（留空 = 用默认值）</span>`);
      return;
    }
    // HH:MM is the one free-text value whose typos fail silently: the bridge
    // treats an unparsable time as "off", so the daily run just never happens.
    if (key === 'memoryConsolidateTime' && value !== '' && !/^\d{1,2}:\d{2}$/.test(value)) {
      $('#saveMsg').innerHTML = `<span class="err">整理时间要写成 HH:MM，收到「${esc(value)}」</span>`;
      return;
    }
    updates[key] = value === '' ? null : value;
  }
  if (Object.keys(updates).length === 0) return;
  const names = Object.keys(updates).map((k) => F(k).label || k);
  // This profile is patchReload: live — saving reloads the plugin — so the click
  // says what it is about to do before doing it.
  if (isAdvanced() && !confirm(`保存并写入 profile 配置？\n\n将修改 ${names.length} 项：\n${names.join('、')}\n\n这个 profile 是热重载：写盘后桥会立即重新加载。`)) return;
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    const j = await api('/api/config', { method: 'POST', body: JSON.stringify({ updates }) });
    $('#saveMsg').innerHTML = `<span class="ok">已保存</span> ${j.changed.length} 项 · 备份 ${esc(String(j.backup || '').split(/[\\/]/).pop())}`;
    toast('已保存。改动会在桥下次重载时生效（本 profile 是热重载，通常几秒内）。');
    S.dirty = {};
    updateSaveBar();
    await loadAll();
  } catch (e) {
    $('#saveMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
}

// ── 概览 ────────────────────────────────────────────────────────────────────
function renderOverview(root) {
  const h = S.health;
  const e = S.data?.environment ?? {};
  const mem = S.memory ?? { facts: 0 };
  const lines = S.problems?.lines ?? [];
  const convs = S.data?.conversations?.length ?? 0;
  root.innerHTML = `
    <h2>${isAdvanced() ? '概览' : '现在能不能用'}</h2>
    <p class="lead">${isAdvanced()
      ? '桥的健康状况、最近的失败记录与关键计数。左边是配置，需要改哪里点哪里。'
      : '先看这一行。绿灯就表示已经能用了——直接在微信里给它发消息即可。红灯会告诉你缺什么、去哪儿填。'}</p>

    <div class="card">
      <div class="statusline"><span class="dot ${h ? (h.ok ? 'ok' : 'bad') : ''}"></span>
        <span>${esc(h ? h.summary : '体检中…')}</span>
        <span class="spacer"></span>
        <button class="ghost" id="recheck">重新体检</button></div>
      <div class="checks">
        ${(h?.checks ?? []).map((c) => `<div class="check">
          <span class="dot ${c.state}"></span>
          <span class="what">${esc(c.label)}</span>
          <span><span class="why">${esc(c.detail)}</span>${c.fix ? `<div class="fix">怎么解决：${esc(c.fix)}</div>` : ''}</span>
        </div>`).join('') || '<div class="dim">正在读取…</div>'}
      </div>
    </div>

    <div class="grid2">
      <div class="stat"><div class="k">微信对话</div><div class="v">${convs}</div><div class="dim2">个会话在磁盘上</div></div>

let SELECTED = null;
const KNOB_META = {
  turns:        { type:'number', label:'轮数上限', min:1, hint:'满多少轮就换对话' },
  tokenBudget:  { type:'number', label:'token 预算', min:1000, hint:'上下文到这个数就换' },
  pressureRatio:{ type:'number', label:'上下文占比', min:0.05, max:1, step:0.05, hint:'占窗口的百分比，0–1' },
  idleHours:    { type:'number', label:'空闲小时', min:1, hint:'多久没说话才算空闲' },
  handoff:      { type:'boolean', label:'生成要点交接', hint:'换对话前让旧对话产出一段要点，多一次模型调用' },
  announce:     { type:'boolean', label:'在微信里播报', hint:'换对话时告诉你一声' },
  idleOnly:     { type:'boolean', label:'只在空闲时换（推荐）', hint:'正在处理任务时不换，避免把活切成两半' },
};
function renderKnobs() {
  // Knob edits are remembered per scheme, so switching cards to compare them
  // does not silently throw away what was already typed.
  S.knobs ??= {};
  const box = $('#knobs');
  const label = $('#knobFor');
  if (!box) return;
  const id = S.selectedScheme ?? S.data?.activeScheme;
  const scheme = (S.data?.schemes ?? []).find((s) => s.id === id);
  SELECTED = scheme ?? null;
  if (!scheme) { box.innerHTML = ''; if (label) label.textContent = '先点一个方案'; return; }
  if (label) label.textContent = `${scheme.id} · ${scheme.label}`;
  box.innerHTML = Object.entries(scheme.knobs).map(([key, value]) => {
    const meta = KNOB_META[key] || { type: typeof value === 'boolean' ? 'boolean' : 'number', label:key };
    const remembered = S.knobs[scheme.id]?.[key];
    const shown = remembered === undefined ? value : remembered;
    const control = meta.type === 'boolean'
      ? `<label class="check"><input type="checkbox" data-knob="${esc(key)}" ${shown ? 'checked' : ''}> ${esc(meta.label)}</label>`
      : `<input type="number" data-knob="${esc(key)}" class="mono" style="max-width:140px" value="${esc(String(shown))}">`;
    return `<div class="stat"><div class="k">${esc(meta.label)}${remembered === undefined ? '' : ' <span class="tag warn">已改</span>'}</div><div style="margin-top:5px">${control}</div>
      <div class="dim2" style="margin-top:4px">${esc(meta.hint || '')}</div></div>`;
  }).join('');
  // Collect as the user types so the values survive a re-render and the apply
  // button always sends what is on screen.
  box.querySelectorAll('[data-knob]').forEach((el) => el.addEventListener('change', () => {
    const id2 = scheme.id;
    S.knobs[id2] ??= {};
    S.knobs[id2][el.dataset.knob] = el.type === 'checkbox' ? el.checked : Number(el.value.trim());
  }));
}
function readKnobs() {
  const out = {};
  document.querySelectorAll('[data-knob]').forEach((el) => {
    const key = el.dataset.knob;
    if (el.type === 'checkbox') out[key] = el.checked;
    else { const n = Number(el.value.trim()); if (Number.isFinite(n)) out[key] = n; }
  });
  return out;
}

async function forget(id) {
  if (!confirm(`删除会话 ${id}？\n\n会移入 $DSH_HOME/sessions-trash/（可手动恢复），并让桥解绑。`)) return;
  try {
    const j = await api('/api/session/forget', { method: 'POST', body: JSON.stringify({ sessionId: id }) });
    toast(`已删除 ${esc(id)} → ${esc(j.trash || '回收站')}`);
    await loadState(); go('chat');
  } catch (e) { toast('<span class="err">' + esc(e.message) + '</span>'); }
}

async function loadReports() {
  const box = $('#sessionBox');
  if (!box) return;
  try {
    const j = await api('/api/session/box');
    box.textContent = j.reports.length === 0 ? '（暂无）'
      : j.reports.map((r) => `${r.at || ''}  ${r.command?.op || '?'} → ${r.ok ? 'OK' : 'FAIL'}  ${r.detail || ''}`).join('\n');
  } catch { box.textContent = '（读取失败）'; }
}

    <p class="lead">${isAdvanced()
      ? '桥把每一次被吞掉的失败都写进了问题日志（它是"有痕迹"的落点）。这里能看原文、能回滚配置。'
      : '它出问题时不会装作没事——都会记在这个文件里。想让它修好，先把这里的报错发给我。'}</p>

    <div class="card">
      <div class="head"><strong>问题记录</strong><span class="hint">${lines.length} 行 · 日志会自动轮转，不会撑爆磁盘</span>
        <span class="spacer"></span><button class="mini" id="reloadProblems">刷新</button></div>
      ${lines.length === 0 ? '<div class="ok">最近没有记录到问题。</div>' : `<pre>${esc(lines.slice(-120).join('\n'))}</pre>`}
      <div class="hint">文件：<span class="mono">${esc(p.file || '')}</span>${p.rotated ? '（上一份在 .1）' : ''}</div>
    </div>

    <div class="card">
      <div class="head"><strong>宿主状态</strong><span class="hint">桥下次启动时会看到的</span></div>
      <table><tbody>
        <tr><td>DSH home</td><td class="mono">${esc(e.dshHome || '')}</td></tr>
        <tr><td>profile</td><td class="mono">${esc(e.profile || '')}</td></tr>
        <tr><td>patch 文件</td><td class="mono">${esc(e.patchFile || '')} <span class="tag">${e.patchExists ? '存在' : '不存在'}</span></td></tr>
        <tr><td>preset</td><td class="mono">${esc(e.preset || '')} <span class="${e.presetExists ? 'ok' : 'err'}">${e.presetExists ? '已就位' : '缺失'}</span></td></tr>
        <tr><td>白名单</td><td>${(e.allowFrom ?? []).map(esc).join('、') || '<span class="warn">空</span>'}</td></tr>
        <tr><td>微信凭据</td><td>${e.weixinCredentials ? '<span class="ok">已配置</span>' : '<span class="warn">未找到</span>'}</td></tr>
      </tbody></table>
    </div>

    ${isAdvanced() ? `<div class="card">
      <div class="head"><strong>配置备份与回滚</strong><span class="hint">每次保存自动保留最近 5 份，下面按时间倒序列出（回滚前会再存一份当前配置）</span>
        <span class="spacer"></span><button class="mini" id="reloadBackups">刷新</button></div>
      <table><thead><tr><th>备份</th><th>时间</th><th>大小</th><th></th></tr></thead><tbody>
        ${backups.length === 0 ? '<tr><td colspan="4" class="dim">还没有备份（保存一次就会出现）</td></tr>' : backups.map((b) => `<tr>
          <td class="mono">${esc(b.name)}</td><td class="dim">${esc(new Date(b.at).toLocaleString())}</td>
          <td class="mono">${(b.bytes/1024).toFixed(1)}K</td>
          <td><button class="mini" data-restore="${esc(b.name)}">回滚到这个版本</button></td></tr>`).join('')}
      </tbody></table>
      <div class="hint">回滚会先把当前配置另存为一份新备份，所以回滚本身也可以再回滚。</div>
    </div>` : ''}`;

  $('#reloadProblems').addEventListener('click', async () => { await loadProblems(); renderDiag(root); });
  const rb = $('#reloadBackups');
  if (rb) rb.addEventListener('click', async () => { await loadBackups(); renderDiag(root); });
  root.querySelectorAll('[data-restore]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm(`回滚到 ${b.dataset.restore}？\n\n当前配置会先自动备份一份。`)) return;
    try {
      const j = await api('/api/rollback', { method: 'POST', body: JSON.stringify({ name: b.dataset.restore }) });
      toast(`已回滚到 ${esc(j.restored)}（当前状态存为 ${esc(j.safety)}）`);
      await loadAll(); go('diag');
    } catch (e) { toast('<span class="err">' + esc(e.message) + '</span>'); }
  }));
}

// ── loaders ─────────────────────────────────────────────────────────────────
async function loadState() { S.data = await api('/api/state'); renderHeaderPills(); }
async function loadHealth() { S.health = await api('/api/health'); renderHeaderPills(); }
async function loadProblems() { try { S.problems = await api('/api/problems?limit=300'); } catch { S.problems = { lines:[], file:'' }; } }
async function loadMemory() { try { S.memory = await api('/api/memory'); } catch { S.memory = null; } }
async function loadModels() { try { S.models = await api('/api/models'); } catch { S.models = null; } }
async function loadBackups() { try { S.backups = await api('/api/backups'); } catch { S.backups = null; } }
function renderHeaderPills() {
  const h = S.health;
  $('#healthDot').className = 'dot ' + (h ? (h.ok ? 'ok' : 'bad') : '');
  $('#healthText').textContent = h ? h.summary : '体检中…';
  const e = S.data?.environment;
  $('#patchPill').innerHTML = e ? `patch <span class="mono">${esc(String(e.patchFile || '').split(/[\\/]/).pop())}</span>` : '';
}

async function loadAll() {
  // Individually guarded: one failing endpoint must not blank the whole console,
  // because the endpoint most likely to fail is the one that explains why.
  const results = await Promise.allSettled([loadState(), loadHealth(), loadProblems(), loadMemory(), loadModels(), loadBackups()]);
  const failed = results.filter((r) => r.status === 'rejected');
  if (!S.data) {
    const first = failed[0];
    $('#main').innerHTML = `<div class="banner">读不到配置：${esc(first?.reason?.message ?? '管理台服务没有响应')}<br>
      确认管理台进程还在跑（<span class="mono">node admin/server.ts</span>），然后刷新本页。</div>`;
    return;
  }
  if (failed.length > 0) toast(`<span class="warn">有 ${failed.length} 个面板没能加载</span>（其余照常可用）`);
  renderHeaderPills();
  const s = SECTIONS.find((x) => x.id === S.section);
  if (s) s.render($('#main'));
  else go('overview');
}

// ── mode + boot ─────────────────────────────────────────────────────────────
S.mode = localStorage.getItem('wechat-admin-mode') === 'advanced' ? 'advanced' : 'simple';

function renderModes() {
  $('#modes').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.mode === S.mode));
}
$('#modes').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
  S.mode = b.dataset.mode;
  localStorage.setItem('wechat-admin-mode', S.mode);
  renderModes();
  if (!isAdvanced() && ['context','chat','fields'].includes(S.section)) S.section = 'overview';
  renderNav();
  go(S.section);
}));
$('#saveBtn').addEventListener('click', save);
$('#revertBtn').addEventListener('click', async () => { S.dirty = {}; await loadAll(); updateSaveBar(); toast('已放弃未保存的修改'); });
window.addEventListener('beforeunload', (e) => { if (Object.keys(S.dirty).length > 0) { e.preventDefault(); e.returnValue = ''; } });

renderModes();
renderNav();
loadAll().catch((e) => {
  const hint = /forbidden/i.test(e.message)
    ? '令牌不对：请用管理台启动时打印的那个带 token 的地址打开，或直接访问 http://127.0.0.1:8790/（只允许本机打开）。'
    : '确认管理台进程还在跑，然后刷新本页。';
  $('#main').innerHTML = `<div class="banner">加载失败：${esc(e.message)}<br>${esc(hint)}</div>`;
});
</script>
</body>
</html>
