# dsh-chatnode-wechat bundle layer: mounts the iLink gateway and the
# WeChat conversation node as one composed plugin row.
#
# `allowFrom` is REQUIRED with no permissive default: an agent that accepts
# instructions from any WeChat contact is a prompt-injection front door.
# Messages from non-allowlisted senders are logged and ignored, never fed
# to the model. See packages/chatnode-wechat/README.md for the full config.
- insert:
    - id: dsh-chatnode-wechat
      name: '@dsh-cowork/chatnode-wechat'
      config:
        allowFrom: []
    # Web management page (settings → plugins → 微信桥配置) removed on request:
    # the config-api row is no longer mounted, and the client settings page is
    # no longer served (see `package.json`: no "./client" export, no dsh.client
    # block). Configure the bridge through the profile's cordis.patch.yml.
    # Rationale beyond preference: that row hard-required the optional
    # `webServer` service, which left it pending in every profile without a web
    # server and made dsh-app-boot fail the whole profile with
    # "plugin tree failed to load: 1 entry did not activate".
